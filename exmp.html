<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good Morning</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;

        .card {
            text-align: center;
            background: white;

        }

        .sun {
            font-size: 70px;
        }

        h1 {
            font-size: 45px;
            margin: 15px 0;
            color: #ff8c00;
        }

        p {
            font-size: 20px;
            color: #555;

        }

        button {
            border: none;
            padding: 14px 25px;
            border-radius: 25px;
            background: #ff8c00;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #e67600;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="sun">🌞</div>

        <h1>Good Morning!</h1>

        <p>
            Start your day with a positive mind,
            a happy heart, and the confidence

        </p>

        <button onclick="alert('Have an amazing day! 🌟')">

        </button>
    </div>
